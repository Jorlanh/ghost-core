server:
  port: ${GHOST_CORE_PORT:8081}

spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: ghost-core

  #datasource:
  #  url: ${GHOST_DB_URL:jdbc:postgresql://localhost:5432/ghost_db}
  #  username: ${GHOST_DB_USER:postgres}
  #  password: ${GHOST_DB_PASSWORD:admin}
  #  driver-class-name: org.postgresql.Driver

  #flyway:
  #  enabled: true
  #  baseline-on-migrate: true
  #  locations: classpath:db/migration
  #  validate-on-migrate: true

  data:
    redis:
      host: ${GHOST_REDIS_HOST:localhost}
      port: ${GHOST_REDIS_PORT:6379}
    mongodb:
      uri: ${GHOST_MONGODB_URI:mongodb://localhost:27017/ghost_db}

  servlet:
    multipart:
      max-file-size: ${GHOST_MAX_UPLOAD_SIZE:200MB}
      max-request-size: ${GHOST_MAX_REQUEST_SIZE:220MB}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    compatibility-verifier:
      enabled: false
    loadbalancer:
      retry:
        enabled: false

ghost:
  operator:
    timezone: ${GHOST_TIMEZONE:America/Bahia}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    primary-model: ${GHOST_AI_MODEL:llama3:8b}
    fallback-model: ${GHOST_AI_FALLBACK_MODEL:deepseek-r1:8b}
    vision-model: ${GHOST_VISION_MODEL:}
    context-window: ${GHOST_CONTEXT_WINDOW:4096}
    temperature: ${GHOST_TEMPERATURE:0.6}
  voice:
    base-url: ${GHOST_VOICE_URL:http://localhost:5001}
    cache-dir: ${GHOST_AUDIO_CACHE_DIR:audio_cache}
  stt:
    command: ${GHOST_STT_COMMAND:}
  vision:
    capture-screen-on-demand: ${GHOST_CAPTURE_SCREEN:true}
  workspace:
    root: ${GHOST_WORKSPACE_DIR:ghost_workspace}
    deliveries: ${GHOST_DELIVERIES_DIR:ghost_deliveries}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${GHOST_EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: INFO
    com.ghost: DEBUG
    org.springframework.boot.autoconfigure: INFO
    org.hibernate.SQL: WARN
